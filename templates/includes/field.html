{# Champ de formulaire : libellé au-dessus, aide puis erreurs en dessous (AGENTS.md, guide de style). #}
<div class="field{% if field.errors %} has-error{% endif %}">
  <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %}<span class="req" aria-hidden="true"> *</span>{% endif %}</label>
  {{ field }}
  {% if field.help_text %}<span class="help" id="{{ field.auto_id }}_helptext">{{ field.help_text|safe }}</span>{% endif %}
  {% for error in field.errors %}<span class="error" role="alert">{{ error }}</span>{% endfor %}
</div>
