<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><title>Circuit de la TVA</title><rect width="640" height="300" rx="14" fill="#fcfefe"/><text x="320" y="32" text-anchor="middle" font-size="15" font-weight="700" fill="#173f58">Circuit de la TVA</text><rect x="30" y="70" width="260" height="60" rx="8" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="160" y="104" text-anchor="middle" font-size="12" font-weight="600" fill="#173f58">443 État, TVA facturée</text><text x="160" y="150" text-anchor="middle" font-size="12" font-weight="400" fill="#7d93a0">TVA facturée au client</text><rect x="350" y="70" width="260" height="60" rx="8" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="480" y="104" text-anchor="middle" font-size="12" font-weight="600" fill="#173f58">445 État, TVA récupérable</text><text x="480" y="150" text-anchor="middle" font-size="12" font-weight="400" fill="#7d93a0">TVA payée au fournisseur</text><rect x="190" y="190" width="260" height="60" rx="8" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="320" y="224" text-anchor="middle" font-size="12" font-weight="600" fill="#173f58">4441 État, TVA due</text><polyline points="160,130 260,190" fill="none" stroke="#0d665e" stroke-width="2" stroke-linejoin="round"/><polygon points="260,190 251,189.2 255.1,182.5" fill="#0d665e"/><polyline points="480,130 380,190" fill="none" stroke="#0d665e" stroke-width="2" stroke-linejoin="round"/><polygon points="380,190 384.9,182.5 389,189.2" fill="#0d665e"/><text x="320" y="278" text-anchor="middle" font-size="12" font-weight="400" fill="#173f58">TVA à reverser = 443 − 445</text><text x="320" y="56" text-anchor="middle" font-size="12" font-weight="400" fill="#173f58">Taux global : 19,25 % (principal 17,5 % + CAC 10 %)</text></svg>
