<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><rect width="640" height="320" rx="14" fill="#fcfefe"/><text x="320" y="32" text-anchor="middle" font-size="15" font-weight="700" fill="#173f58">The company's filing cycle</text><rect x="30" y="70" width="270" height="60" rx="8" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="165" y="104" text-anchor="middle" font-size="12" font-weight="600" fill="#173f58">Every month, by the 15th</text><text x="165" y="150" text-anchor="start" font-size="11" font-weight="400" fill="#173f58">Return and payment: VAT, CIT instalments, payroll withholdings</text><rect x="340" y="70" width="270" height="60" rx="8" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="475" y="104" text-anchor="middle" font-size="12" font-weight="600" fill="#173f58">Year-end closing</text><text x="475" y="175" text-anchor="middle" font-size="11" font-weight="400" fill="#173f58">Statistical and tax return (DSF), CIT balance</text><rect x="140" y="220" width="360" height="60" rx="8" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="320" y="254" text-anchor="middle" font-size="11" font-weight="600" fill="#173f58">Audit and disputes (Tax procedures book)</text><polyline points="300,100 340,100" fill="none" stroke="#0d665e" stroke-width="2" stroke-linejoin="round"/><polygon points="340,100 331.9,103.9 331.9,96.1" fill="#0d665e"/><polyline points="475,130 420,220" fill="none" stroke="#0d665e" stroke-width="2" stroke-linejoin="round"/><polygon points="420,220 420.9,211 427.6,215.1" fill="#0d665e"/></svg>
